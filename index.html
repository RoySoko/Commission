<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Amanda Sokolowski">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Commission Report</title>
  <style>
    /* Start of CSS */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f0f0;
      font-family: "Georgia", serif;
      color: #333;
    }

    .report-container {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 90%;
      text-align: center;
    }

    .report-container h1 {
      margin-top: 0;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }

    .report-container p {
      margin: 0.75rem 0;
      font-size: 1.1rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <script>
    var userName = prompt("Enter your name:");
    var subtotal = 0;
    var saleInput;
    do {
      saleInput = prompt(
        "Enter the dollar amount for your sales a single sale at a time.\n" +
        "Enter Done when you are finished."
      );
      // If it’s a number, add to subtotal
      if (
        saleInput !== null &&
        saleInput.toLowerCase() !== "done"
      ) {
        var sale = parseFloat(saleInput);
        if (!isNaN(sale)) {
          subtotal += sale;
        }
      }
    } while (
      saleInput !== null &&
      saleInput.toLowerCase() !== "done"
    );

    // Decide rate 
    var rate;
    if (subtotal <= 0) {
      rate = 0;
    } else if (subtotal <= 499.99) {
      rate = 0.05;
    } else if (subtotal <= 999.99) {
      rate = 0.10;
    } else {
      rate = 0.15;
    }

    // Calculate commission & total
    var commission    = subtotal * rate;
    var totalEarnings = subtotal + commission;

    document.write(
      '<div class="report-container">' +
        "<h1>Hello " + userName + ", Here is your Weekly Commission Report.</h1>" +
        "<p>Your sales total is $"     + subtotal.toFixed(2) +
           ", so your commission rate is " + (rate*100).toFixed(2) + "%</p>" +
        "<p>Your total commission is $" + commission.toFixed(2) + ".</p>" +
        "<p>Your total earnings are $"  + totalEarnings.toFixed(2) + "</p>" +
      "</div>"
    );

  </script>
</body>
</html>
